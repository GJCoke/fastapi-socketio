<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
</head>
<body>
<h1>{{title}}</h1>
<p>Loading docs from <code>{{schema_url}}</code>...</p>
<div id="app"></div>
<script>
const SCHEMA_URL = "{{schema_url}}";
fetch(SCHEMA_URL).then(r => r.json()).then(data => {
  document.getElementById("app").textContent = JSON.stringify(data, null, 2);
});
</script>
</body>
</html>

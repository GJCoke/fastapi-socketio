<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root {
  --sw-green: #49cc90;
  --sw-green-bg: rgba(73,204,144,0.1);
  --sw-green-border: #49cc90;
  --sw-orange: #fca130;
  --sw-orange-bg: rgba(252,161,48,0.1);
  --sw-orange-border: #fca130;
  --sw-red: #f93e3e;
  --sw-red-bg: rgba(249,62,62,0.1);
  --sw-red-border: #f93e3e;
  --sw-blue: #61affe;
  --sw-topbar: #fff;
  --sw-bg: #fafafa;
  --sw-white: #fff;
  --sw-border: #d8dde7;
  --sw-text: #3b4151;
  --sw-text-secondary: #6b6b6b;
  --sw-text-light: #999;
  --sw-execute: #4990e2;
  --sw-execute-hover: #357abd;
  --sw-cancel: #ff6060;
  --sw-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sw-font-mono: "Source Code Pro", Consolas, Monaco, monospace;
  --sw-radius: 4px;
  --sw-transition: 0.25s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sw-font);
  background: var(--sw-bg);
  color: var(--sw-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ═══════ Topbar ═══════ */
.topbar {
  background: var(--sw-topbar);
  padding: 12px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--sw-border);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.topbar-inner {
  width: 100%;
  max-width: 1460px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.topbar-logo svg { width: 22px; height: 22px; }
.topbar-logo span {
  color: var(--sw-text);
  font-size: 16px;
  font-weight: 700;
}

/* Connection controls */
.topbar-conn {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-conn label {
  color: var(--sw-text-secondary);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
.topbar-conn input,
.topbar-conn select {
  background: var(--sw-white);
  border: 1px solid var(--sw-border);
  color: var(--sw-text);
  font-size: 13px;
  padding: 5px 10px;
  border-radius: 4px;
  font-family: var(--sw-font-mono);
  outline: none;
  transition: border-color var(--sw-transition);
}
.topbar-conn input:focus,
.topbar-conn select:focus {
  border-color: var(--sw-green);
  box-shadow: 0 0 0 2px rgba(73,204,144,0.15);
}
.topbar-conn input { width: 220px; }
.topbar-conn select { min-width: 70px; cursor: pointer; }
.conn-btn {
  padding: 6px 16px;
  border: 2px solid var(--sw-green);
  background: transparent;
  color: var(--sw-green);
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--sw-transition);
  font-family: var(--sw-font);
}
.conn-btn:hover { background: var(--sw-green); color: #fff; }
.conn-btn.connected { border-color: var(--sw-red); color: var(--sw-red); background: transparent; }
.conn-btn.connected:hover { background: var(--sw-red); color: #fff; }
.conn-status { display: flex; align-items: center; gap: 6px; }
.conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ccc;
  transition: background 0.3s;
}
.conn-dot.on {
  background: var(--sw-green);
  box-shadow: 0 0 6px rgba(73,204,144,0.5);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 6px rgba(73,204,144,0.4); }
  50% { box-shadow: 0 0 12px rgba(73,204,144,0.8); }
}
.conn-status-text { color: var(--sw-text-light); font-size: 11px; font-weight: 600; }

/* Authorize button */
.auth-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border: 1px solid var(--sw-border);
  background: transparent;
  color: var(--sw-text-secondary);
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--sw-font);
}
.auth-btn:hover { border-color: var(--sw-text-secondary); color: var(--sw-text); }
.auth-btn.has-auth { border-color: var(--sw-green); color: var(--sw-green); }
.auth-btn.has-auth:hover { background: rgba(73,204,144,0.05); }
.auth-btn svg { width: 14px; height: 14px; fill: currentColor; }

/* ═══════ Info Section ═══════ */
.info-section {
  background: var(--sw-bg);
  padding: 30px 0 16px;
}
.info-inner {
  max-width: 1460px;
  margin: 0 auto;
  padding: 0 20px;
}
.info-title {
  font-size: 36px;
  font-weight: 700;
  color: var(--sw-text);
  line-height: 1.2;
}
.info-title small {
  font-size: 12px;
  font-weight: 700;
  background: #89bf04;
  color: #fff;
  padding: 4px 10px;
  border-radius: 20px;
  vertical-align: super;
  margin-left: 10px;
  position: relative;
  top: -6px;
}
.info-base-url {
  font-size: 14px;
  color: var(--sw-text-secondary);
  margin-top: 8px;
}
.info-base-url code {
  font-family: var(--sw-font-mono);
  font-size: 12px;
  color: var(--sw-text);
}

/* ═══════ Main ═══════ */
.swagger-ui {
  max-width: 1460px;
  margin: 0 auto;
  padding: 8px 20px 80px;
}

/* ═══════ Tag Group (Namespace) ═══════ */
.tag-group {
  border: none;
  border-bottom: 1px solid rgba(59,65,81,0.3);
  border-radius: 0;
  margin-bottom: 0;
  padding-top: 16px;
  background: transparent;
  overflow: visible;
}
.tag-header {
  display: flex;
  align-items: center;
  padding: 10px 20px 10px 10px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.tag-header:hover { background: rgba(0,0,0,0.02); }
.tag-name {
  font-size: 24px;
  font-weight: 700;
  color: #3b4151;
}
.tag-desc {
  font-size: 13px;
  color: var(--sw-text-light);
  margin-left: 14px;
}
.tag-count {
  font-size: 12px;
  color: var(--sw-text-light);
  margin-left: 10px;
}
.tag-arrow {
  margin-left: auto;
  width: 20px;
  height: 20px;
  color: var(--sw-text-secondary);
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.tag-arrow svg { width: 20px; height: 20px; fill: currentColor; }
.tag-group.open > .tag-header .tag-arrow { transform: rotate(180deg); }

/* Accordion: CSS Grid approach (no max-height jank) */
.tag-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease;
}
.tag-group.open > .tag-body {
  grid-template-rows: 1fr;
}
.tag-body-inner {
  overflow: hidden;
  padding: 0 2px;
}
.tag-group.open > .tag-body > .tag-body-inner {
  padding: 0 2px 8px;
}

/* ═══════ Operation ═══════ */
.operation {
  margin: 0 0 5px 0;
  border-radius: 4px;
  overflow: visible;
}

.op-header {
  display: flex;
  align-items: center;
  padding: 5px 20px 5px 0;
  cursor: pointer;
  user-select: none;
  min-height: 50px;
  border-radius: 4px;
  transition: box-shadow 0.15s;
}
.op-header:hover {
  box-shadow: 0 0 0 1px rgba(0,0,0,0.06);
}

.op-method {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 80px;
  padding: 6px 15px;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  color: #fff;
  border-radius: 3px;
  margin: 0 16px 0 8px;
  flex-shrink: 0;
  font-family: var(--sw-font);
  text-shadow: 0 1px 0 rgba(0,0,0,0.1);
}
.op-method.emit { background: var(--sw-green); }
.op-method.connect { background: var(--sw-orange); }
.op-method.disconnect { background: var(--sw-red); }

.op-header.emit-bg { background: var(--sw-green-bg); border: 1px solid var(--sw-green-border); }
.op-header.orange-bg { background: var(--sw-orange-bg); border: 1px solid var(--sw-orange-border); }
.op-header.red-bg { background: var(--sw-red-bg); border: 1px solid var(--sw-red-border); }

.op-path {
  font-size: 16px;
  font-weight: 600;
  color: var(--sw-text);
  flex-shrink: 0;
  font-family: var(--sw-font-mono);
}
.op-summary {
  font-size: 13px;
  color: var(--sw-text-secondary);
  margin-left: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.op-expand {
  margin-left: auto;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  padding: 0;
  margin-right: 0;
  color: var(--sw-text-secondary);
  transition: transform 0.2s ease;
}
.op-expand svg { width: 20px; height: 20px; fill: currentColor; }
.operation.open .op-expand { transform: rotate(180deg); }

/* Expanded body: CSS Grid accordion */
.op-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease;
}
.operation.open .op-body {
  grid-template-rows: 1fr;
}
.op-body-inner {
  overflow: hidden;
}
.operation.open .op-body-inner {
  padding: 20px;
}

.op-body.emit-body { background: var(--sw-green-bg); border-radius: 0 0 4px 4px; border: none; }
.op-body.orange-body { background: var(--sw-orange-bg); border-radius: 0 0 4px 4px; border: none; }
.op-body.red-body { background: var(--sw-red-bg); border-radius: 0 0 4px 4px; border: none; }
.operation.open .op-body.emit-body { border: 1px solid var(--sw-green-border); border-top: none; }
.operation.open .op-body.orange-body { border: 1px solid var(--sw-orange-border); border-top: none; }
.operation.open .op-body.red-body { border: 1px solid var(--sw-red-border); border-top: none; }

.op-desc {
  font-size: 14px;
  color: var(--sw-text);
  margin-bottom: 18px;
  line-height: 1.6;
}

/* ═══════ Parameters ═══════ */
.section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--sw-text);
  padding: 10px 0;
  border-bottom: 1px solid var(--sw-border);
}

.params-table {
  width: 100%;
  border-collapse: collapse;
}
.params-table th {
  text-align: left;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--sw-text-secondary);
  border-bottom: 1px solid var(--sw-border);
  background: rgba(0,0,0,0.02);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.params-table td {
  padding: 12px 14px;
  border-bottom: 1px solid #eef0f3;
  font-size: 13px;
  vertical-align: top;
}
.params-table tr:last-child td { border-bottom: none; }
.params-table tbody tr:hover { background: rgba(0,0,0,0.01); }
.param-name { font-weight: 700; color: var(--sw-text); font-size: 16px; }
.param-name .required {
  color: var(--sw-red);
  font-size: 10px;
  font-weight: 700;
  display: block;
  margin-top: 2px;
}
.param-type {
  font-family: var(--sw-font-mono);
  font-size: 12px;
  color: var(--sw-text-secondary);
}

/* Schema */
.schema-section { margin-top: 18px; }
.schema-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--sw-border);
}
.schema-title-row .section-title { border-bottom: none; padding: 0; margin: 0; }
.schema-model-name {
  font-family: var(--sw-font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--sw-text-secondary);
  background: rgba(0,0,0,0.05);
  padding: 2px 8px;
  border-radius: 3px;
}
.schema-block {
  background: var(--sw-white);
  border: 1px solid var(--sw-border);
  border-radius: 4px;
  padding: 10px 20px;
  font-family: var(--sw-font-mono);
  font-size: 12px;
  line-height: 1.8;
  margin-top: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  color: var(--sw-text);
}
.s-bracket { color: var(--sw-text-light); }
.s-key { color: #e06c75; }
.s-type { color: #61aeee; }
.s-required { color: var(--sw-red); font-size: 10px; font-weight: 600; }
.s-optional { color: #bbb; font-size: 10px; }

/* ═══════ Responses ═══════ */
.responses-section { margin-top: 22px; }
.response-row {
  display: flex;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}
.response-code {
  font-weight: 700;
  font-size: 14px;
  min-width: 60px;
  color: var(--sw-text);
}
.response-desc {
  font-size: 13px;
  color: var(--sw-text-secondary);
  flex: 1;
}
.no-data { color: var(--sw-text-light); font-style: italic; }

/* ═══════ Try It Out ═══════ */
.try-section {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid rgba(0,0,0,0.06);
}
.try-btn {
  padding: 5px 23px;
  border: 1px solid #888;
  background: transparent;
  color: #888;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  float: right;
  font-family: var(--sw-font);
}
.try-btn:hover { border-color: var(--sw-text); color: var(--sw-text); }
.try-btn.active { border-color: var(--sw-cancel); color: var(--sw-cancel); }
.try-btn.active:hover { background: rgba(255,96,96,0.05); }

.try-editor {
  display: none;
  margin-top: 12px;
  clear: both;
  animation: fadeSlideIn 0.2s ease-out;
}
.try-editor.visible { display: block; }
.try-editor label {
  font-size: 12px;
  font-weight: 700;
  color: var(--sw-text-secondary);
  display: block;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.try-editor textarea {
  width: 100%;
  min-height: 110px;
  padding: 12px 14px;
  border: 1px solid var(--sw-border);
  border-radius: 4px;
  font-family: var(--sw-font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  background: var(--sw-white);
  color: var(--sw-text);
  outline: none;
  transition: border-color 0.15s;
}
.try-editor textarea:focus {
  border-color: var(--sw-blue);
  box-shadow: 0 0 0 3px rgba(97,175,254,0.12);
}
.try-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.execute-btn {
  padding: 8px 40px;
  background: var(--sw-execute);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  font-family: var(--sw-font);
}
.execute-btn:hover { background: var(--sw-execute-hover); }
.cancel-try-btn {
  padding: 8px 20px;
  background: transparent;
  border: 1px solid #aaa;
  color: var(--sw-text-secondary);
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--sw-font);
}
.cancel-try-btn:hover { background: #f0f0f0; border-color: #888; }

/* Server response */
.server-response {
  display: none;
  margin-top: 18px;
  animation: fadeSlideIn 0.2s ease-out;
}
.server-response.visible { display: block; }
.response-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.response-header h5 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--sw-text);
}
.clear-response-btn {
  font-size: 11px;
  color: var(--sw-text-light);
  background: none;
  border: 1px solid #ddd;
  border-radius: 3px;
  padding: 3px 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.clear-response-btn:hover { background: #f0f0f0; border-color: #bbb; }
.response-log {
  background: #333;
  border-radius: 4px;
  padding: 14px 16px;
  max-height: 280px;
  overflow-y: auto;
  font-family: var(--sw-font-mono);
  font-size: 12px;
  line-height: 1.8;
}
.response-log::-webkit-scrollbar { width: 6px; }
.response-log::-webkit-scrollbar-track { background: transparent; }
.response-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
.response-log::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
.response-log .log-entry { margin-bottom: 2px; }
.response-log .ts { color: #5c6370; }
.response-log .arr-out { color: #49cc90; }
.response-log .arr-in { color: #fca130; }
.response-log .lbl-emit { color: #49cc90; font-weight: 600; }
.response-log .lbl-ack { color: #61affe; font-weight: 600; }
.response-log .lbl-event { color: #f93e3e; font-weight: 600; }
.response-log .lbl-err { color: #f93e3e; font-weight: 600; }
.response-log .ev-name { color: #e5e7eb; font-weight: 500; }
.response-log .ev-data { color: #9ca3af; }

/* ═══════ Animations ═══════ */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ═══════ Loading ═══════ */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--sw-text-light);
  font-size: 15px;
  animation: fadeIn 0.4s;
}
.loading::before {
  content: "";
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid #e0e0e0;
  border-top-color: var(--sw-execute);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-right: 10px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--sw-text-light);
  font-size: 15px;
}

/* ═══════ Footer ═══════ */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--sw-text-light);
  font-size: 12px;
  border-top: 1px solid var(--sw-border);
  margin-top: 20px;
}
.footer a { color: var(--sw-text-secondary); text-decoration: none; }
.footer a:hover { color: var(--sw-text); }

/* ═══════ Auth Modal ═══════ */
.auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.15s;
}
.auth-modal {
  background: var(--sw-white);
  border-radius: 4px;
  width: 480px;
  max-width: 90vw;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  animation: fadeSlideIn 0.2s ease-out;
}
.auth-modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--sw-border);
}
.auth-modal-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--sw-text);
  margin-bottom: 2px;
}
.auth-modal-header p {
  font-size: 12px;
  color: var(--sw-text-light);
}
.auth-modal-body { padding: 16px 20px; }
.auth-modal-body label {
  font-size: 12px;
  font-weight: 700;
  color: var(--sw-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: block;
  margin-bottom: 6px;
}
.auth-modal-body textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px 14px;
  border: 1px solid var(--sw-border);
  border-radius: 4px;
  font-family: var(--sw-font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  background: var(--sw-bg);
  color: var(--sw-text);
  outline: none;
  transition: border-color 0.15s;
}
.auth-modal-body textarea:focus {
  border-color: var(--sw-blue);
  box-shadow: 0 0 0 3px rgba(97,175,254,0.12);
}
.auth-modal-footer {
  padding: 12px 20px 16px;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.auth-modal-footer .auth-connect-btn {
  padding: 7px 24px;
  background: var(--sw-execute);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.auth-modal-footer .auth-connect-btn:hover { background: var(--sw-execute-hover); }
.auth-modal-footer .auth-skip-btn {
  padding: 7px 20px;
  background: transparent;
  border: 1px solid var(--sw-border);
  color: var(--sw-text-secondary);
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.auth-modal-footer .auth-skip-btn:hover { background: #f0f0f0; border-color: #bbb; }

/* ═══════ Responsive ═══════ */
@media (max-width: 900px) {
  .topbar-conn label { display: none; }
  .topbar-conn input { width: 160px; }
}
@media (max-width: 768px) {
  .topbar-inner { gap: 10px; }
  .topbar-conn input { width: 120px; }
  .info-title { font-size: 26px; }
  .op-method { min-width: auto; font-size: 12px; padding: 4px 10px; margin: 0 8px; }
  .op-path { font-size: 14px; }
  .op-summary { display: none; }
  .schema-block { font-size: 11px; padding: 10px 14px; }
  .execute-btn { padding: 8px 24px; }
}
@media (max-width: 480px) {
  .topbar-conn select { display: none; }
  .topbar-conn input { width: 100px; font-size: 11px; }
  .info-title { font-size: 22px; }
  .op-header { padding-right: 10px; }
}
</style>
</head>
<body>

<!-- ═══════ Topbar ═══════ -->
<div class="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="#">
      <svg viewBox="0 0 24 24" fill="#49cc90"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>Socket.IO Docs</span>
    </a>
    <div class="topbar-conn">
      <label>Server</label>
      <input type="text" id="server-url" placeholder="ws://localhost:8000">
      <label>NS</label>
      <select id="ns-select"><option value="/">/</option></select>
      <button class="auth-btn" id="auth-btn"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>Authorize</button>
      <button class="conn-btn" id="conn-btn">Connect</button>
      <div class="conn-status">
        <span class="conn-dot" id="conn-dot"></span>
        <span class="conn-status-text" id="conn-text">Offline</span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════ Info Section ═══════ -->
<div class="info-section">
  <div class="info-inner">
    <h1 class="info-title">{{title}} <small id="version-badge"></small></h1>
    <div class="info-base-url" id="base-url-display"></div>
  </div>
</div>

<!-- ═══════ Main ═══════ -->
<div class="swagger-ui" id="app">
  <div class="loading">Loading schema...</div>
</div>

<script>
const SCHEMA_URL = "{{schema_url}}";
let socket = null;
let schemaData = null;

/* ─── Fetch & Render ─── */
fetch(SCHEMA_URL).then(r => r.json()).then(data => {
  schemaData = data;
  document.getElementById("version-badge").textContent = "v" + (data.version || "1.0.0");
  const origin = window.location.origin;
  document.getElementById("server-url").value = origin;
  document.getElementById("base-url-display").innerHTML = 'Base URL: <code>' + esc(origin) + '</code>';
  populateNs(data);
  render(data);
}).catch(() => {
  document.getElementById("app").innerHTML = '<div class="empty-state">Failed to load schema from <code>' + esc(SCHEMA_URL) + '</code></div>';
});

function populateNs(data) {
  const sel = document.getElementById("ns-select");
  sel.innerHTML = "";
  for (const ns of Object.keys(data.namespaces || {})) {
    const o = document.createElement("option");
    o.value = ns; o.textContent = ns;
    if (ns === "/") o.selected = true;
    sel.appendChild(o);
  }
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const namespaces = Object.entries(data.namespaces || {});
  if (namespaces.length === 0) {
    app.innerHTML = '<div class="empty-state">No events registered</div>';
    return;
  }
  for (const [ns, nsData] of namespaces) {
    app.appendChild(buildTagGroup(ns, nsData.events || []));
  }
}

/* ─── Tag Group ─── */
function buildTagGroup(ns, events) {
  const group = document.createElement("div");
  group.className = "tag-group open";

  const header = document.createElement("div");
  header.className = "tag-header";
  const displayName = ns === "/" ? "default" : ns;
  header.innerHTML = '<span class="tag-name">' + esc(displayName) + '</span><span class="tag-desc">namespace: ' + esc(ns) + '</span><span class="tag-count">' + events.length + '</span><span class="tag-arrow"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></span>';
  header.onclick = function() { group.classList.toggle("open"); };

  const body = document.createElement("div");
  body.className = "tag-body";
  const inner = document.createElement("div");
  inner.className = "tag-body-inner";
  for (const ev of events) inner.appendChild(buildOperation(ev, ns));
  body.appendChild(inner);

  group.appendChild(header);
  group.appendChild(body);
  return group;
}

/* ─── Operation Card ─── */
function buildOperation(ev, ns) {
  const op = document.createElement("div");
  op.className = "operation";

  const badge = getBadge(ev);

  /* Header */
  const hdr = document.createElement("div");
  hdr.className = "op-header " + badge.bgCls;
  hdr.innerHTML = '<span class="op-method ' + badge.cls + '">' + badge.label + '</span><span class="op-path">' + esc(ev.event) + '</span><span class="op-summary">' + esc(ev.summary || "") + '</span><span class="op-expand"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></span>';
  hdr.onclick = function() { op.classList.toggle("open"); };

  /* Body wrapper (grid accordion) */
  const bodyWrap = document.createElement("div");
  bodyWrap.className = "op-body " + badge.bodyCls;
  const bodyInner = document.createElement("div");
  bodyInner.className = "op-body-inner";

  /* Description */
  if (ev.description && ev.description !== ev.summary) {
    const desc = document.createElement("div");
    desc.className = "op-desc";
    desc.textContent = ev.description;
    bodyInner.appendChild(desc);
  }

  /* Parameters / Request Schema */
  if (ev.request_schema) {
    bodyInner.appendChild(buildRequestSection(ev));
  }

  /* Responses */
  bodyInner.appendChild(buildResponseSection(ev));

  /* Try it out (only for emit events) */
  if (!ev.is_connect && !ev.is_disconnect) {
    bodyInner.appendChild(buildTrySection(ev, ns));
  }

  bodyWrap.appendChild(bodyInner);
  op.appendChild(hdr);
  op.appendChild(bodyWrap);
  return op;
}

function getBadge(ev) {
  if (ev.is_connect) return { label: "CONNECT", cls: "connect", bgCls: "orange-bg", bodyCls: "orange-body" };
  if (ev.is_disconnect) return { label: "DISCONNECT", cls: "disconnect", bgCls: "red-bg", bodyCls: "red-body" };
  return { label: "EMIT", cls: "emit", bgCls: "emit-bg", bodyCls: "emit-body" };
}

/* ─── Request Section ─── */
function buildRequestSection(ev) {
  const sec = document.createElement("div");
  sec.className = "schema-section";

  const titleRow = document.createElement("div");
  titleRow.className = "schema-title-row";
  titleRow.innerHTML = '<span class="section-title">Parameters</span>' + (ev.request_schema.title ? '<span class="schema-model-name">' + esc(ev.request_schema.title) + '</span>' : '');
  sec.appendChild(titleRow);

  if (ev.request_schema.properties) {
    sec.appendChild(buildParamsTable(ev.request_schema));
    sec.appendChild(buildSchemaBlock(ev.request_schema));
  } else if (ev.request_schema.type) {
    const block = document.createElement("div");
    block.className = "schema-block";
    block.innerHTML = '<span class="s-type">' + esc(ev.request_schema.type) + '</span>';
    sec.appendChild(block);
  }

  return sec;
}

function buildParamsTable(schema) {
  const required = schema.required || [];
  const table = document.createElement("table");
  table.className = "params-table";
  table.innerHTML = '<thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead>';
  const tbody = document.createElement("tbody");
  for (const [k, v] of Object.entries(schema.properties || {})) {
    const isReq = required.includes(k);
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td><span class="param-name">' + esc(k) + '</span>' + (isReq ? '<span class="required">* required</span>' : '') + '</td>' +
      '<td><span class="param-type">' + esc(v.type || "any") + '</span></td>' +
      '<td>' + (v.description ? esc(v.description) : '<span class="no-data">\u2014</span>') + '</td>';
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function buildSchemaBlock(schema) {
  const required = schema.required || [];
  var lines = ['<span class="s-bracket">{</span>'];
  for (const [k, v] of Object.entries(schema.properties || {})) {
    const isReq = required.includes(k);
    const reqMark = isReq ? ' <span class="s-required">// required</span>' : ' <span class="s-optional">// optional</span>';
    const defStr = v.default !== undefined ? ' = ' + JSON.stringify(v.default) : '';
    lines.push('  <span class="s-key">"' + esc(k) + '"</span>: <span class="s-type">' + esc(v.type || "any") + '</span>' + esc(defStr) + reqMark);
  }
  lines.push('<span class="s-bracket">}</span>');
  const block = document.createElement("div");
  block.className = "schema-block";
  block.innerHTML = lines.join("\n");
  return block;
}

/* ─── Response Section ─── */
function buildResponseSection(ev) {
  const sec = document.createElement("div");
  sec.className = "responses-section";

  const title = document.createElement("div");
  title.className = "section-title";
  title.textContent = "Responses";
  sec.appendChild(title);

  if (ev.response_schema) {
    if (ev.response_schema.title) {
      const modelTag = document.createElement("div");
      modelTag.style.cssText = "padding:8px 0;";
      modelTag.innerHTML = '<span class="schema-model-name">' + esc(ev.response_schema.title) + '</span>';
      sec.appendChild(modelTag);
    }
    if (ev.response_schema.properties) {
      sec.appendChild(buildSchemaBlock(ev.response_schema));
    } else if (ev.response_schema.type) {
      const block = document.createElement("div");
      block.className = "schema-block";
      block.innerHTML = '<span class="s-type">' + esc(ev.response_schema.type) + '</span>';
      sec.appendChild(block);
    }
  } else {
    const nd = document.createElement("div");
    nd.className = "no-data";
    nd.style.padding = "10px 0";
    nd.textContent = "No response schema defined";
    sec.appendChild(nd);
  }

  return sec;
}

/* ─── Try It Out Section ─── */
function buildTrySection(ev, ns) {
  const sec = document.createElement("div");
  sec.className = "try-section";

  const example = ev.request_schema && ev.request_schema.properties ? buildExample(ev.request_schema) : "";
  const uid = "try-" + ns.replace(/\//g, "_") + "-" + ev.event;

  /* Try it out button */
  const tryBtn = document.createElement("button");
  tryBtn.className = "try-btn";
  tryBtn.textContent = "Try it out";

  /* Editor area (hidden initially) */
  const editor = document.createElement("div");
  editor.className = "try-editor";
  editor.innerHTML =
    '<label>Request body</label>' +
    '<textarea id="' + uid + '-ta">' + esc(example ? JSON.stringify(example, null, 2) : "") + '</textarea>' +
    '<div class="try-actions">' +
      '<button class="execute-btn" id="' + uid + '-exec">Execute</button>' +
      '<button class="cancel-try-btn" id="' + uid + '-cancel">Cancel</button>' +
    '</div>';

  /* Response area (hidden initially) */
  const resp = document.createElement("div");
  resp.className = "server-response";
  resp.innerHTML =
    '<div class="response-header">' +
      '<h5>Server response</h5>' +
      '<button class="clear-response-btn" id="' + uid + '-clear">Clear</button>' +
    '</div>' +
    '<div class="response-log" id="' + uid + '-log"></div>';

  var active = false;

  tryBtn.onclick = function() {
    if (!active) {
      active = true;
      tryBtn.textContent = "Cancel";
      tryBtn.classList.add("active");
      editor.classList.add("visible");
    } else {
      active = false;
      tryBtn.textContent = "Try it out";
      tryBtn.classList.remove("active");
      editor.classList.remove("visible");
    }
  };

  sec.appendChild(tryBtn);
  sec.appendChild(editor);
  sec.appendChild(resp);

  /* Wire up after DOM is ready */
  setTimeout(function() {
    const execBtn = document.getElementById(uid + "-exec");
    const cancelBtn = document.getElementById(uid + "-cancel");
    const clearBtn = document.getElementById(uid + "-clear");
    const ta = document.getElementById(uid + "-ta");
    const logDiv = document.getElementById(uid + "-log");

    if (execBtn) execBtn.onclick = function() {
      var payload;
      try { payload = ta.value.trim() ? JSON.parse(ta.value) : undefined; } catch (e) { alert("Invalid JSON: " + e.message); return; }
      resp.classList.add("visible");
      sendEvent(ev.event, payload, logDiv);
    };
    if (cancelBtn) cancelBtn.onclick = function() {
      active = false;
      tryBtn.textContent = "Try it out";
      tryBtn.classList.remove("active");
      editor.classList.remove("visible");
    };
    if (clearBtn) clearBtn.onclick = function() { logDiv.innerHTML = ""; };
  }, 0);

  return sec;
}

function buildExample(schema) {
  const obj = {};
  for (const [k, v] of Object.entries(schema.properties || {})) {
    if (v.default !== undefined) obj[k] = v.default;
    else if (v.type === "string") obj[k] = "";
    else if (v.type === "integer" || v.type === "number") obj[k] = 0;
    else if (v.type === "boolean") obj[k] = false;
    else obj[k] = null;
  }
  return obj;
}

/* ═══════ Socket.IO ═══════ */
function connectSio(url, ns, auth) {
  if (socket) { socket.disconnect(); socket = null; }
  const opts = { transports: ["websocket", "polling"] };
  if (auth !== undefined) opts.auth = auth;
  socket = io(url + ns, opts);
  socket.on("connect", function() {
    document.getElementById("conn-dot").classList.add("on");
    document.getElementById("conn-text").textContent = "Online";
  });
  socket.on("disconnect", function() {
    document.getElementById("conn-dot").classList.remove("on");
    document.getElementById("conn-text").textContent = "Offline";
  });
  socket.onAny(function(eventName) {
    var args = Array.prototype.slice.call(arguments, 1);
    document.querySelectorAll(".response-log").forEach(function(log) {
      addLog(log, "event", eventName, args.length === 1 ? args[0] : args);
    });
  });
}

function sendEvent(event, payload, logDiv) {
  if (!socket || !socket.connected) {
    addLog(logDiv, "error", "Not connected \u2014 click Connect first", null);
    return;
  }
  addLog(logDiv, "emit", event, payload);
  if (payload !== undefined) {
    socket.emit(event, payload, function(ack) { if (ack !== undefined) addLog(logDiv, "ack", event, ack); });
  } else {
    socket.emit(event, function(ack) { if (ack !== undefined) addLog(logDiv, "ack", event, ack); });
  }
}

function addLog(logDiv, type, event, data) {
  const entry = document.createElement("div");
  entry.className = "log-entry";
  const ts = new Date().toLocaleTimeString();
  var arrow, label;
  if (type === "emit") { arrow = '<span class="arr-out">\u2192</span>'; label = '<span class="lbl-emit">emit</span>'; }
  else if (type === "ack") { arrow = '<span class="arr-in">\u2190</span>'; label = '<span class="lbl-ack">ack</span>'; }
  else if (type === "event") { arrow = '<span class="arr-in">\u2190</span>'; label = '<span class="lbl-event">event</span>'; }
  else { arrow = '<span class="arr-in">\u26a0</span>'; label = '<span class="lbl-err">error</span>'; }
  const d = data !== undefined && data !== null ? " " + JSON.stringify(data) : "";
  entry.innerHTML = '<span class="ts">' + ts + '</span> ' + arrow + ' ' + label + ' <span class="ev-name">' + esc(event) + '</span><span class="ev-data">' + esc(d) + '</span>';
  logDiv.appendChild(entry);
  logDiv.scrollTop = logDiv.scrollHeight;
}

/* ═══════ Connection Controls ═══════ */
var authPayload = undefined;

function updateAuthBtn() {
  const btn = document.getElementById("auth-btn");
  if (authPayload !== undefined) {
    btn.classList.add("has-auth");
  } else {
    btn.classList.remove("has-auth");
  }
}

function doConnect(url, ns) {
  connectSio(url, ns, authPayload);
  const btn = document.getElementById("conn-btn");
  btn.textContent = "Disconnect";
  btn.classList.add("connected");
}

function showAuthModal() {
  var currentJson = authPayload !== undefined ? JSON.stringify(authPayload, null, 2) : '{\n  \n}';
  const overlay = document.createElement("div");
  overlay.className = "auth-overlay";
  overlay.innerHTML =
    '<div class="auth-modal">' +
      '<div class="auth-modal-header">' +
        '<h3>Authorize</h3>' +
        '<p>Set auth payload for Socket.IO connection</p>' +
      '</div>' +
      '<div class="auth-modal-body">' +
        '<label>Auth JSON' + (authPayload !== undefined ? ' <span style="color:#49cc90;font-size:10px;text-transform:none;letter-spacing:0">(configured)</span>' : '') + '</label>' +
        '<textarea id="auth-ta">' + esc(currentJson) + '</textarea>' +
      '</div>' +
      '<div class="auth-modal-footer">' +
        (authPayload !== undefined ? '<button class="auth-skip-btn" id="auth-clear">Clear</button>' : '') +
        '<button class="auth-skip-btn" id="auth-cancel">Cancel</button>' +
        '<button class="auth-connect-btn" id="auth-save">Save</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  const ta = document.getElementById("auth-ta");
  setTimeout(function() { ta.focus(); }, 50);

  const close = function() { overlay.remove(); };

  overlay.addEventListener("click", function(e) { if (e.target === overlay) close(); });
  document.getElementById("auth-save").onclick = function() {
    var val = ta.value.trim();
    if (!val || val === '{}' || val === '{\n  \n}') {
      authPayload = undefined;
    } else {
      try { authPayload = JSON.parse(val); } catch (e) { alert("Invalid JSON: " + e.message); return; }
    }
    updateAuthBtn();
    close();
  };
  document.getElementById("auth-cancel").onclick = function() { close(); };
  var clearBtn = document.getElementById("auth-clear");
  if (clearBtn) clearBtn.onclick = function() {
    authPayload = undefined;
    updateAuthBtn();
    close();
  };

  var onKey = function(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
}

document.getElementById("auth-btn").onclick = function() { showAuthModal(); };

document.getElementById("conn-btn").onclick = function() {
  if (socket && socket.connected) {
    socket.disconnect(); socket = null;
    this.textContent = "Connect";
    this.classList.remove("connected");
    document.getElementById("conn-dot").classList.remove("on");
    document.getElementById("conn-text").textContent = "Offline";
  } else {
    var url = document.getElementById("server-url").value.replace(/\/$/, "");
    var ns = document.getElementById("ns-select").value;
    doConnect(url, ns);
  }
};

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
</body>
</html>

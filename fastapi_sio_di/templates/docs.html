<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root {
  --sw-green: #49cc90;
  --sw-green-bg: rgba(73,204,144,0.1);
  --sw-green-border: #49cc90;
  --sw-orange: #fca130;
  --sw-orange-bg: rgba(252,161,48,0.1);
  --sw-orange-border: #fca130;
  --sw-red: #f93e3e;
  --sw-red-bg: rgba(249,62,62,0.1);
  --sw-red-border: #f93e3e;
  --sw-blue: #61affe;
  --sw-blue-bg: rgba(97,175,254,0.1);
  --sw-blue-border: #61affe;
  --sw-topbar: #1b1b1b;
  --sw-info-bg: #fafafa;
  --sw-bg: #fafafa;
  --sw-white: #fff;
  --sw-border: #d8dde7;
  --sw-text: #3b4151;
  --sw-text-secondary: #6b6b6b;
  --sw-text-light: #999;
  --sw-execute: #4990e2;
  --sw-execute-hover: #357abd;
  --sw-cancel: #ff6060;
  --sw-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sw-font-mono: "Source Code Pro", "SF Mono", Monaco, Consolas, "Liberation Mono", monospace;
  --sw-radius: 4px;
  --sw-shadow: 0 1px 2px 0 rgba(0,0,0,0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sw-font);
  background: var(--sw-bg);
  color: var(--sw-text);
  font-size: 14px;
  line-height: 1.5;
}

/* ═══════ Topbar ═══════ */
.topbar {
  background: var(--sw-topbar);
  padding: 8px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.topbar-inner {
  width: 100%;
  max-width: 1460px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.topbar-logo svg { width: 22px; height: 22px; }
.topbar-logo span {
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

/* Connection controls in topbar */
.topbar-conn {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-conn label {
  color: #aaa;
  font-size: 12px;
  font-weight: 500;
}
.topbar-conn input,
.topbar-conn select {
  background: #333;
  border: 1px solid #555;
  color: #eee;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 3px;
  font-family: var(--sw-font-mono);
  outline: none;
}
.topbar-conn input:focus,
.topbar-conn select:focus { border-color: var(--sw-green); }
.topbar-conn input { width: 200px; }
.topbar-conn select { min-width: 70px; }
.conn-btn {
  padding: 4px 12px;
  border: 2px solid var(--sw-green);
  background: transparent;
  color: var(--sw-green);
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.conn-btn:hover { background: var(--sw-green); color: #fff; }
.conn-btn.connected {
  border-color: var(--sw-red);
  color: var(--sw-red);
}
.conn-btn.connected:hover { background: var(--sw-red); color: #fff; }
.conn-status {
  display: flex;
  align-items: center;
  gap: 5px;
}
.conn-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--sw-red);
}
.conn-dot.on { background: var(--sw-green); }
.conn-status-text { color: #aaa; font-size: 11px; }

/* ═══════ Info Section ═══════ */
.info-section {
  background: var(--sw-info-bg);
  padding: 30px 0 20px;
  border-bottom: 1px solid var(--sw-border);
}
.info-inner {
  max-width: 1460px;
  margin: 0 auto;
  padding: 0 20px;
}
.info-title {
  font-size: 36px;
  font-weight: 700;
  color: var(--sw-text);
  line-height: 1.2;
  margin-bottom: 4px;
}
.info-title small {
  font-size: 13px;
  font-weight: 500;
  background: #89bf04;
  color: #fff;
  padding: 2px 8px;
  border-radius: 20px;
  vertical-align: middle;
  margin-left: 8px;
  position: relative;
  top: -4px;
}
.info-base-url {
  font-size: 14px;
  color: var(--sw-text-secondary);
  margin-top: 8px;
}
.info-base-url a {
  color: var(--sw-text);
  font-weight: 500;
  text-decoration: none;
}
.info-base-url code {
  font-family: var(--sw-font-mono);
  font-size: 13px;
  color: var(--sw-text);
}

/* ═══════ Main Content ═══════ */
.swagger-ui {
  max-width: 1460px;
  margin: 0 auto;
  padding: 20px 20px 60px;
}

/* ═══════ Tag Group (Namespace) ═══════ */
.tag-group {
  margin-bottom: 10px;
  border: 1px solid var(--sw-border);
  border-radius: var(--sw-radius);
  background: var(--sw-white);
}
.tag-header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: background 0.15s;
}
.tag-header:hover { background: rgba(0,0,0,0.02); }
.tag-group.open > .tag-header { border-bottom-color: var(--sw-border); }
.tag-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--sw-text);
}
.tag-count {
  font-size: 12px;
  color: var(--sw-text-light);
  margin-left: 10px;
}
.tag-arrow {
  margin-left: auto;
  font-size: 18px;
  color: var(--sw-text-light);
  transition: transform 0.2s;
}
.tag-group.open > .tag-header .tag-arrow { transform: rotate(180deg); }
.tag-body { display: none; }
.tag-group.open > .tag-body { display: block; }

/* ═══════ Operation (Event Card) ═══════ */
.operation {
  border-bottom: 1px solid var(--sw-border);
}
.operation:last-child { border-bottom: none; }

/* --- Collapsed header --- */
.op-header {
  display: flex;
  align-items: center;
  padding: 5px 20px 5px 0;
  cursor: pointer;
  user-select: none;
  gap: 0;
  min-height: 48px;
  transition: background 0.15s;
}

/* Color band on left */
.op-method {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 80px;
  padding: 6px 0;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  color: #fff;
  border-radius: 3px;
  margin: 5px 15px 5px 20px;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.op-method.emit { background: var(--sw-green); }
.op-method.connect { background: var(--sw-orange); }
.op-method.disconnect { background: var(--sw-red); }

.op-header.emit-bg { background: var(--sw-green-bg); border: 1px solid var(--sw-green-border); border-left: none; border-right: none; }
.op-header.orange-bg { background: var(--sw-orange-bg); border: 1px solid var(--sw-orange-border); border-left: none; border-right: none; }
.op-header.red-bg { background: var(--sw-red-bg); border: 1px solid var(--sw-red-border); border-left: none; border-right: none; }

.op-path {
  font-size: 16px;
  font-weight: 600;
  color: var(--sw-text);
  flex-shrink: 0;
}
.op-summary {
  font-size: 13px;
  color: var(--sw-text-secondary);
  margin-left: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.op-expand {
  margin-left: auto;
  flex-shrink: 0;
  padding: 4px 8px;
  font-size: 10px;
  color: var(--sw-text-light);
  transition: transform 0.2s;
}
.operation.open .op-expand { transform: rotate(180deg); }

/* --- Expanded body --- */
.op-body {
  display: none;
  padding: 20px;
  border-top: none;
}
.operation.open .op-body { display: block; }

.op-body.emit-body { background: var(--sw-green-bg); }
.op-body.orange-body { background: var(--sw-orange-bg); }
.op-body.red-body { background: var(--sw-red-bg); }

/* Description */
.op-desc {
  font-size: 14px;
  color: var(--sw-text-secondary);
  margin-bottom: 16px;
  line-height: 1.6;
}

/* ═══════ Parameters Section ═══════ */
.section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--sw-text);
  padding: 10px 0;
  border-bottom: 1px solid var(--sw-border);
  margin-bottom: 0;
}

.params-table {
  width: 100%;
  border-collapse: collapse;
}
.params-table th {
  text-align: left;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--sw-text-secondary);
  border-bottom: 1px solid var(--sw-border);
  background: rgba(0,0,0,0.02);
}
.params-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
  vertical-align: top;
}
.params-table tr:last-child td { border-bottom: none; }
.param-name { font-weight: 600; color: var(--sw-text); }
.param-name .required {
  color: var(--sw-red);
  font-size: 10px;
  font-weight: 700;
  display: block;
  margin-top: 2px;
}
.param-type {
  font-family: var(--sw-font-mono);
  font-size: 12px;
  color: var(--sw-text-secondary);
}

/* Request body (schema preview) */
.schema-section { margin-top: 16px; }
.schema-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--sw-border);
}
.schema-title-row .section-title { border-bottom: none; padding: 0; margin: 0; }
.schema-model-name {
  font-family: var(--sw-font-mono);
  font-size: 12px;
  color: var(--sw-text-secondary);
  background: rgba(0,0,0,0.05);
  padding: 2px 6px;
  border-radius: 3px;
}
.schema-block {
  background: var(--sw-white);
  border: 1px solid var(--sw-border);
  border-radius: var(--sw-radius);
  padding: 14px 16px;
  font-family: var(--sw-font-mono);
  font-size: 13px;
  line-height: 1.8;
  margin-top: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
}
.s-bracket { color: var(--sw-text-light); }
.s-key { color: #e06c75; }
.s-type { color: #61aeee; }
.s-required { color: var(--sw-red); font-size: 10px; font-weight: 600; }
.s-optional { color: #bbb; font-size: 10px; }

/* ═══════ Responses Section ═══════ */
.responses-section { margin-top: 20px; }
.response-row {
  display: flex;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}
.response-code {
  font-weight: 700;
  font-size: 14px;
  min-width: 60px;
  color: var(--sw-text);
}
.response-desc {
  font-size: 13px;
  color: var(--sw-text-secondary);
  flex: 1;
}
.no-data { color: var(--sw-text-light); font-style: italic; }

/* ═══════ Try It Out ═══════ */
.try-btn {
  padding: 5px 18px;
  border: 2px solid var(--sw-text-secondary);
  background: transparent;
  color: var(--sw-text-secondary);
  border-radius: var(--sw-radius);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  float: right;
}
.try-btn:hover { background: var(--sw-text-secondary); color: #fff; }
.try-btn.active {
  border-color: var(--sw-cancel);
  color: var(--sw-cancel);
}
.try-btn.active:hover { background: var(--sw-cancel); color: #fff; }

.try-editor {
  display: none;
  margin-top: 12px;
}
.try-editor.visible { display: block; }
.try-editor label {
  font-size: 12px;
  font-weight: 600;
  color: var(--sw-text-secondary);
  display: block;
  margin-bottom: 4px;
}
.try-editor textarea {
  width: 100%;
  min-height: 100px;
  padding: 10px;
  border: 1px solid var(--sw-border);
  border-radius: var(--sw-radius);
  font-family: var(--sw-font-mono);
  font-size: 13px;
  line-height: 1.5;
  resize: vertical;
  background: var(--sw-white);
  color: var(--sw-text);
  outline: none;
}
.try-editor textarea:focus { border-color: var(--sw-blue); box-shadow: 0 0 0 3px rgba(97,175,254,0.15); }
.try-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.execute-btn {
  padding: 8px 40px;
  background: var(--sw-execute);
  color: #fff;
  border: none;
  border-radius: var(--sw-radius);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--sw-shadow);
}
.execute-btn:hover { background: var(--sw-execute-hover); }
.cancel-try-btn {
  padding: 8px 20px;
  background: transparent;
  border: 2px solid #aaa;
  color: var(--sw-text-secondary);
  border-radius: var(--sw-radius);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.cancel-try-btn:hover { background: #eee; }

/* Server response */
.server-response {
  display: none;
  margin-top: 16px;
}
.server-response.visible { display: block; }
.response-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.response-header h5 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.clear-response-btn {
  font-size: 11px;
  color: var(--sw-text-light);
  background: none;
  border: 1px solid #ddd;
  border-radius: 3px;
  padding: 2px 8px;
  cursor: pointer;
}
.clear-response-btn:hover { background: #f0f0f0; }
.response-log {
  background: #1b1b1b;
  border-radius: var(--sw-radius);
  padding: 12px 14px;
  max-height: 250px;
  overflow-y: auto;
  font-family: var(--sw-font-mono);
  font-size: 12px;
  line-height: 1.7;
}
.response-log::-webkit-scrollbar { width: 6px; }
.response-log::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.response-log .log-entry { margin-bottom: 2px; }
.response-log .ts { color: #666; }
.response-log .arr-out { color: #49cc90; }
.response-log .arr-in { color: #fca130; }
.response-log .lbl-emit { color: #49cc90; font-weight: 600; }
.response-log .lbl-ack { color: #61affe; font-weight: 600; }
.response-log .lbl-event { color: #f93e3e; font-weight: 600; }
.response-log .lbl-err { color: #f93e3e; font-weight: 600; }
.response-log .ev-name { color: #e5e7eb; font-weight: 500; }
.response-log .ev-data { color: #9ca3af; }

/* ═══════ Loading ═══════ */
.loading { text-align: center; padding: 60px; color: var(--sw-text-light); font-size: 15px; }
.loading::before { content: ""; display: inline-block; width: 20px; height: 20px; border: 2px solid #ddd; border-top-color: var(--sw-execute); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 10px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════ Responsive ═══════ */
@media (max-width: 768px) {
  .topbar-conn input { width: 140px; }
  .info-title { font-size: 26px; }
  .op-method { min-width: 60px; font-size: 12px; margin: 5px 10px 5px 10px; }
  .op-path { font-size: 14px; }
  .schema-block { font-size: 12px; }
}
</style>
</head>
<body>

<!-- ═══════ Topbar ═══════ -->
<div class="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="#">
      <svg viewBox="0 0 24 24" fill="#49cc90"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>Socket.IO Docs</span>
    </a>
    <div class="topbar-conn">
      <label>Server</label>
      <input type="text" id="server-url" placeholder="ws://localhost:8000">
      <label>NS</label>
      <select id="ns-select"><option value="/">/</option></select>
      <button class="conn-btn" id="conn-btn">Connect</button>
      <div class="conn-status">
        <span class="conn-dot" id="conn-dot"></span>
        <span class="conn-status-text" id="conn-text">Offline</span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════ Info Section ═══════ -->
<div class="info-section">
  <div class="info-inner">
    <h1 class="info-title">{{title}} <small id="version-badge"></small></h1>
    <div class="info-base-url" id="base-url-display"></div>
  </div>
</div>

<!-- ═══════ Main ═══════ -->
<div class="swagger-ui" id="app">
  <div class="loading">Loading schema...</div>
</div>

<script>
const SCHEMA_URL = "{{schema_url}}";
let socket = null;
let schemaData = null;

/* ─── Fetch & Render ─── */
fetch(SCHEMA_URL).then(r => r.json()).then(data => {
  schemaData = data;
  document.getElementById("version-badge").textContent = "v" + (data.version || "1.0.0");
  const origin = window.location.origin;
  document.getElementById("server-url").value = origin;
  document.getElementById("base-url-display").innerHTML = 'Base URL: <code>' + esc(origin) + '</code>';
  populateNs(data);
  render(data);
});

function populateNs(data) {
  const sel = document.getElementById("ns-select");
  sel.innerHTML = "";
  for (const ns of Object.keys(data.namespaces || {})) {
    const o = document.createElement("option");
    o.value = ns; o.textContent = ns;
    sel.appendChild(o);
  }
}

function render(data) {
  const app = document.getElementById("app");
  app.innerHTML = "";
  for (const [ns, nsData] of Object.entries(data.namespaces || {})) {
    app.appendChild(buildTagGroup(ns, nsData.events || []));
  }
}

/* ─── Tag Group ─── */
function buildTagGroup(ns, events) {
  const group = document.createElement("div");
  group.className = "tag-group open";

  const header = document.createElement("div");
  header.className = "tag-header";
  header.innerHTML = `<span class="tag-name">${esc(ns === "/" ? "default" : ns)}</span><span class="tag-count">${events.length} event${events.length !== 1 ? "s" : ""}</span><span class="tag-arrow">▾</span>`;
  header.onclick = () => group.classList.toggle("open");

  const body = document.createElement("div");
  body.className = "tag-body";
  for (const ev of events) body.appendChild(buildOperation(ev, ns));

  group.appendChild(header);
  group.appendChild(body);
  return group;
}

/* ─── Operation Card ─── */
function buildOperation(ev, ns) {
  const op = document.createElement("div");
  op.className = "operation";

  const badge = getBadge(ev);

  /* Header */
  const hdr = document.createElement("div");
  hdr.className = "op-header " + badge.bgCls;
  hdr.innerHTML = `<span class="op-method ${badge.cls}">${badge.label}</span><span class="op-path">${esc(ev.event)}</span><span class="op-summary">${esc(ev.summary || "")}</span><span class="op-expand">▾</span>`;
  hdr.onclick = () => op.classList.toggle("open");

  /* Body */
  const body = document.createElement("div");
  body.className = "op-body " + badge.bodyCls;

  /* Description */
  if (ev.description && ev.description !== ev.summary) {
    const desc = document.createElement("div");
    desc.className = "op-desc";
    desc.textContent = ev.description;
    body.appendChild(desc);
  }

  /* Parameters / Request Schema */
  if (ev.request_schema) {
    body.appendChild(buildRequestSection(ev));
  }

  /* Responses */
  body.appendChild(buildResponseSection(ev));

  /* Try it out (only for emit events) */
  if (!ev.is_connect && !ev.is_disconnect) {
    body.appendChild(buildTrySection(ev, ns));
  }

  op.appendChild(hdr);
  op.appendChild(body);
  return op;
}

function getBadge(ev) {
  if (ev.is_connect) return { label: "CONNECT", cls: "connect", bgCls: "orange-bg", bodyCls: "orange-body" };
  if (ev.is_disconnect) return { label: "DISCONNECT", cls: "disconnect", bgCls: "red-bg", bodyCls: "red-body" };
  return { label: "EMIT", cls: "emit", bgCls: "emit-bg", bodyCls: "emit-body" };
}

/* ─── Request Section ─── */
function buildRequestSection(ev) {
  const sec = document.createElement("div");
  sec.className = "schema-section";

  const titleRow = document.createElement("div");
  titleRow.className = "schema-title-row";
  titleRow.innerHTML = `<span class="section-title">Parameters</span>${ev.request_schema.title ? '<span class="schema-model-name">' + esc(ev.request_schema.title) + '</span>' : ''}`;
  sec.appendChild(titleRow);

  if (ev.request_schema.properties) {
    sec.appendChild(buildParamsTable(ev.request_schema));
    sec.appendChild(buildSchemaBlock(ev.request_schema));
  } else if (ev.request_schema.type) {
    const block = document.createElement("div");
    block.className = "schema-block";
    block.innerHTML = '<span class="s-type">' + esc(ev.request_schema.type) + '</span>';
    sec.appendChild(block);
  }

  return sec;
}

function buildParamsTable(schema) {
  const required = schema.required || [];
  const table = document.createElement("table");
  table.className = "params-table";
  table.innerHTML = '<thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead>';
  const tbody = document.createElement("tbody");
  for (const [k, v] of Object.entries(schema.properties || {})) {
    const isReq = required.includes(k);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="param-name">${esc(k)}</span>${isReq ? '<span class="required">* required</span>' : ''}</td>
      <td><span class="param-type">${esc(v.type || "any")}</span></td>
      <td>${v.description ? esc(v.description) : '<span class="no-data">—</span>'}</td>
    `;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function buildSchemaBlock(schema) {
  const required = schema.required || [];
  let lines = ['<span class="s-bracket">{</span>'];
  for (const [k, v] of Object.entries(schema.properties || {})) {
    const isReq = required.includes(k);
    const reqMark = isReq ? ' <span class="s-required">// required</span>' : ' <span class="s-optional">// optional</span>';
    const defStr = v.default !== undefined ? ' = ' + JSON.stringify(v.default) : '';
    lines.push('  <span class="s-key">"' + esc(k) + '"</span>: <span class="s-type">' + esc(v.type || "any") + '</span>' + esc(defStr) + reqMark);
  }
  lines.push('<span class="s-bracket">}</span>');
  const block = document.createElement("div");
  block.className = "schema-block";
  block.innerHTML = lines.join("\n");
  return block;
}

/* ─── Response Section ─── */
function buildResponseSection(ev) {
  const sec = document.createElement("div");
  sec.className = "responses-section";

  const title = document.createElement("div");
  title.className = "section-title";
  title.textContent = "Responses";
  sec.appendChild(title);

  if (ev.response_schema) {
    if (ev.response_schema.title) {
      const modelTag = document.createElement("div");
      modelTag.style.cssText = "padding:8px 0;";
      modelTag.innerHTML = '<span class="schema-model-name">' + esc(ev.response_schema.title) + '</span>';
      sec.appendChild(modelTag);
    }
    if (ev.response_schema.properties) {
      sec.appendChild(buildSchemaBlock(ev.response_schema));
    } else if (ev.response_schema.type) {
      const block = document.createElement("div");
      block.className = "schema-block";
      block.innerHTML = '<span class="s-type">' + esc(ev.response_schema.type) + '</span>';
      sec.appendChild(block);
    }
  } else {
    const nd = document.createElement("div");
    nd.className = "no-data";
    nd.style.padding = "10px 0";
    nd.textContent = "No response schema defined";
    sec.appendChild(nd);
  }

  return sec;
}

/* ─── Try It Out Section ─── */
function buildTrySection(ev, ns) {
  const sec = document.createElement("div");
  sec.style.marginTop = "20px";

  const example = ev.request_schema && ev.request_schema.properties ? buildExample(ev.request_schema) : "";
  const uid = "try-" + ns.replace(/\//g, "_") + "-" + ev.event;

  /* Try it out button */
  const tryBtn = document.createElement("button");
  tryBtn.className = "try-btn";
  tryBtn.textContent = "Try it out";

  /* Editor area (hidden initially) */
  const editor = document.createElement("div");
  editor.className = "try-editor";
  editor.innerHTML = `
    <label>Request body</label>
    <textarea id="${uid}-ta">${esc(example ? JSON.stringify(example, null, 2) : "")}</textarea>
    <div class="try-actions">
      <button class="execute-btn" id="${uid}-exec">Execute</button>
      <button class="cancel-try-btn" id="${uid}-cancel">Cancel</button>
    </div>
  `;

  /* Response area (hidden initially) */
  const resp = document.createElement("div");
  resp.className = "server-response";
  resp.innerHTML = `
    <div class="response-header">
      <h5>Server response</h5>
      <button class="clear-response-btn" id="${uid}-clear">Clear</button>
    </div>
    <div class="response-log" id="${uid}-log"></div>
  `;

  let active = false;

  tryBtn.onclick = () => {
    if (!active) {
      active = true;
      tryBtn.textContent = "Cancel";
      tryBtn.classList.add("active");
      editor.classList.add("visible");
    } else {
      active = false;
      tryBtn.textContent = "Try it out";
      tryBtn.classList.remove("active");
      editor.classList.remove("visible");
    }
  };

  sec.appendChild(tryBtn);
  sec.appendChild(editor);
  sec.appendChild(resp);

  /* Wire up after DOM is ready */
  setTimeout(() => {
    const execBtn = document.getElementById(uid + "-exec");
    const cancelBtn = document.getElementById(uid + "-cancel");
    const clearBtn = document.getElementById(uid + "-clear");
    const ta = document.getElementById(uid + "-ta");
    const logDiv = document.getElementById(uid + "-log");

    if (execBtn) execBtn.onclick = () => {
      let payload;
      try { payload = ta.value.trim() ? JSON.parse(ta.value) : undefined; } catch (e) { alert("Invalid JSON: " + e.message); return; }
      resp.classList.add("visible");
      sendEvent(ev.event, payload, logDiv);
    };
    if (cancelBtn) cancelBtn.onclick = () => {
      active = false;
      tryBtn.textContent = "Try it out";
      tryBtn.classList.remove("active");
      editor.classList.remove("visible");
    };
    if (clearBtn) clearBtn.onclick = () => { logDiv.innerHTML = ""; };
  }, 0);

  return sec;
}

function buildExample(schema) {
  const obj = {};
  for (const [k, v] of Object.entries(schema.properties || {})) {
    if (v.default !== undefined) obj[k] = v.default;
    else if (v.type === "string") obj[k] = "";
    else if (v.type === "integer" || v.type === "number") obj[k] = 0;
    else if (v.type === "boolean") obj[k] = false;
    else obj[k] = null;
  }
  return obj;
}

/* ═══════ Socket.IO ═══════ */
function connectSio(url, ns) {
  if (socket) { socket.disconnect(); socket = null; }
  socket = io(url + ns, { transports: ["websocket", "polling"] });
  socket.on("connect", () => {
    document.getElementById("conn-dot").classList.add("on");
    document.getElementById("conn-text").textContent = "Online";
  });
  socket.on("disconnect", () => {
    document.getElementById("conn-dot").classList.remove("on");
    document.getElementById("conn-text").textContent = "Offline";
  });
  socket.onAny((eventName, ...args) => {
    document.querySelectorAll(".response-log").forEach(log => {
      addLog(log, "event", eventName, args.length === 1 ? args[0] : args);
    });
  });
}

function sendEvent(event, payload, logDiv) {
  if (!socket || !socket.connected) {
    addLog(logDiv, "error", "Not connected — click Connect first", null);
    return;
  }
  addLog(logDiv, "emit", event, payload);
  if (payload !== undefined) {
    socket.emit(event, payload, (ack) => { if (ack !== undefined) addLog(logDiv, "ack", event, ack); });
  } else {
    socket.emit(event, (ack) => { if (ack !== undefined) addLog(logDiv, "ack", event, ack); });
  }
}

function addLog(logDiv, type, event, data) {
  const entry = document.createElement("div");
  entry.className = "log-entry";
  const ts = new Date().toLocaleTimeString();
  let arrow, label;
  if (type === "emit") { arrow = '<span class="arr-out">→</span>'; label = '<span class="lbl-emit">emit</span>'; }
  else if (type === "ack") { arrow = '<span class="arr-in">←</span>'; label = '<span class="lbl-ack">ack</span>'; }
  else if (type === "event") { arrow = '<span class="arr-in">←</span>'; label = '<span class="lbl-event">event</span>'; }
  else { arrow = '<span class="arr-in">⚠</span>'; label = '<span class="lbl-err">error</span>'; }
  const d = data !== undefined && data !== null ? " " + JSON.stringify(data) : "";
  entry.innerHTML = `<span class="ts">${ts}</span> ${arrow} ${label} <span class="ev-name">${esc(event)}</span><span class="ev-data">${esc(d)}</span>`;
  logDiv.appendChild(entry);
  logDiv.scrollTop = logDiv.scrollHeight;
}

/* ═══════ Connection Controls ═══════ */
document.getElementById("conn-btn").onclick = function() {
  if (socket && socket.connected) {
    socket.disconnect(); socket = null;
    this.textContent = "Connect";
    this.classList.remove("connected");
    document.getElementById("conn-dot").classList.remove("on");
    document.getElementById("conn-text").textContent = "Offline";
  } else {
    const url = document.getElementById("server-url").value.replace(/\/$/, "");
    const ns = document.getElementById("ns-select").value;
    connectSio(url, ns);
    this.textContent = "Disconnect";
    this.classList.add("connected");
  }
};

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
